[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modelguard"
version = "0.1.0"
description = "ML model security: pickle malware scanner, signed manifests, adversarial robustness, backdoor screening"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "scikit-learn"]

[project.scripts]
modelguard = "modelguard.cli:main"

[tool.setuptools]
packages = ["modelguard"]
